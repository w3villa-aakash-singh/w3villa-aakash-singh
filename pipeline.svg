<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" font-family="'Fira Code','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .flow { stroke: #00f7ff; stroke-width: 2; stroke-dasharray: 6 6; fill: none; animation: dash 1s linear infinite; }
    .box  { fill: #11262e; stroke: #00f7ff; stroke-width: 1.5; animation: glow 3s ease-in-out infinite; }
    .t    { fill: #ffffff; font-size: 15px; font-weight: 700; text-anchor: middle; }
    .s    { fill: #8fb8c4; font-size: 11px; text-anchor: middle; }
    .h    { fill: #00f7ff; font-size: 13px; text-anchor: middle; letter-spacing: 1px; }
    @keyframes dash { to { stroke-dashoffset: -12; } }
    @keyframes glow { 0%,100% { stroke-opacity: .45; } 50% { stroke-opacity: 1; } }
  </style>
  <rect width="900" height="230" rx="14" fill="#0b1a20"/>
  <text x="450" y="30" class="h">HOW A REPORT REQUEST FLOWS</text>

  <path class="flow" d="M190 125 H250"/>
  <path class="flow" d="M410 125 L480 85"/>
  <path class="flow" d="M410 125 L480 165"/>
  <path class="flow" d="M650 85 L720 125"/>
  <path class="flow" d="M650 165 L720 125"/>

  <rect class="box" x="30"  y="95"  width="160" height="60" rx="10"/>
  <text class="t" x="110" y="122">React + MUI</text>
  <text class="s" x="110" y="140">filters &amp; dashboards</text>

  <rect class="box" x="250" y="95"  width="160" height="60" rx="10" style="animation-delay:.5s"/>
  <text class="t" x="330" y="122">FastAPI</text>
  <text class="s" x="330" y="140">router &#8594; service</text>

  <rect class="box" x="480" y="55"  width="170" height="60" rx="10" style="animation-delay:1s"/>
  <text class="t" x="565" y="82">Redis</text>
  <text class="s" x="565" y="100">TTL cache</text>

  <rect class="box" x="480" y="135" width="170" height="60" rx="10" style="animation-delay:1.3s"/>
  <text class="t" x="565" y="162">PostgreSQL</text>
  <text class="s" x="565" y="180">CTEs &#8226; indexes</text>

  <rect class="box" x="720" y="95"  width="150" height="60" rx="10" style="animation-delay:1.8s"/>
  <text class="t" x="795" y="122">Response</text>
  <text class="s" x="795" y="140">JSON &#8226; .xlsx export</text>
</svg>

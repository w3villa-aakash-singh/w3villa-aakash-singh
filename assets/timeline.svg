  <g class="n" style="animation-delay:0.58s"><circle class="dot" cx="178" cy="120" r="7"/><circle class="ring" cx="178" cy="120" r="7" style="animation-delay:0.58s"/><text class="pr" x="178" y="150">#319</text><text class="lb" x="178" y="170">Loss dashboard</text><text class="lb" x="178" y="186">index work</text></g>
  <g class="n" style="animation-delay:0.86s"><circle class="dot" cx="286" cy="120" r="7"/><circle class="ring" cx="286" cy="120" r="7" style="animation-delay:0.86s"/><text class="lb" x="286" y="62">OEE calculation</text><text class="lb" x="286" y="78">(A x P x Q)</text><text class="pr" x="286" y="100">#348</text></g>

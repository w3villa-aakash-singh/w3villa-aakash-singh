<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" font-family="'Fira Code','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .line { stroke: #00f7ff; stroke-width: 2; stroke-dasharray: 830; stroke-dashoffset: 830; animation: draw 2.4s ease-out forwards; }
    .n { opacity: 0; animation: pop .5s ease-out forwards; }
    .dot { fill: #00f7ff; }
    .ring { fill: none; stroke: #00f7ff; animation: ring 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .pr { fill: #00f7ff; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .lb { fill: #ffffff; font-size: 11px; text-anchor: middle; }
    .h { fill: #00f7ff; font-size: 13px; text-anchor: middle; letter-spacing: 1px; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ring { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.6); opacity: 0; } }
  </style>
  <rect width="900" height="240" rx="14" fill="#0b1a20"/>
  <text x="450" y="30" class="h">SHIPPED ON KIVO EYE (BY PULL REQUEST NUMBER)</text>

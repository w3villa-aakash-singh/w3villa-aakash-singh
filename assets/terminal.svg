<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="'Fira Code','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .p { fill: #00f7ff; font-size: 15px; }
    .c { fill: #ffffff; font-size: 15px; }
    .o { fill: #7ee787; font-size: 15px; }
    .l1 { animation: l1 14s infinite; } .l2 { animation: l2 14s infinite; }
    .l3 { animation: l3 14s infinite; } .l4 { animation: l4 14s infinite; }
    .cur { fill: #00f7ff; animation: blink 1s steps(1) infinite; }
    @keyframes l1 { 0%,3% {opacity:0} 5%,94% {opacity:1} 98%,100% {opacity:0} }
    @keyframes l2 { 0%,18% {opacity:0} 20%,94% {opacity:1} 98%,100% {opacity:0} }
    @keyframes l3 { 0%,38% {opacity:0} 40%,94% {opacity:1} 98%,100% {opacity:0} }
    @keyframes l4 { 0%,58% {opacity:0} 60%,94% {opacity:1} 98%,100% {opacity:0} }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="900" height="250" rx="14" fill="#0b1a20"/>
  <rect width="900" height="36" rx="14" fill="#11262e"/>
  <rect y="22" width="900" height="14" fill="#11262e"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/><circle cx="46" cy="18" r="6" fill="#ffbd2e"/><circle cx="68" cy="18" r="6" fill="#27c93f"/>
  <text x="450" y="23" fill="#8fb8c4" font-size="12" text-anchor="middle">aakash@kivo-eye: ~</text>

  <g class="l1"><text x="28" y="76" class="p">$</text><text x="46" y="76" class="c">whoami</text>
    <text x="28" y="98" class="o">aakash-singh | full-stack software engineer</text></g>
  <g class="l2"><text x="28" y="130" class="p">$</text><text x="46" y="130" class="c">cat stack.txt</text>
    <text x="28" y="152" class="o">python . fastapi . react . postgresql . redis</text></g>
  <g class="l3"><text x="28" y="184" class="p">$</text><text x="46" y="184" class="c">ls projects/</text>
    <text x="28" y="206" class="o">kivo-eye/   reporting  oee  audit  plc-analytics</text></g>
  <g class="l4"><text x="28" y="238" class="p">$</text><text x="46" y="238" class="c">echo $STATUS</text>
    <text x="196" y="238" class="o">shipping dashboards, one index at a time</text>
    <rect class="cur" x="560" y="225" width="9" height="16"/></g>
</svg>

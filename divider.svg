<svg xmlns="http://www.w3.org/2000/svg" width="900" height="6" viewBox="0 0 900 6" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00f7ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f7ff"/>
      <stop offset="1" stop-color="#00f7ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .bar { animation: slide 4s ease-in-out infinite alternate; }
    @keyframes slide { from { transform: translateX(-300px); } to { transform: translateX(900px); } }
  </style>
  <rect x="0" y="2" width="900" height="2" rx="1" fill="#2c5364" opacity="0.6"/>
  <rect class="bar" x="0" y="1" width="300" height="4" rx="2" fill="url(#g)"/>
</svg>

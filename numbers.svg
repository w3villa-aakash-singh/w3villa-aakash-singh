<svg xmlns="http://www.w3.org/2000/svg" width="900" height="130" viewBox="0 0 900 130" font-family="'Fira Code','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .tile { fill: #11262e; stroke: #2c5364; stroke-width: 1.5; }
    .n { fill: #00f7ff; font-size: 38px; font-weight: 700; text-anchor: middle; }
    .l { fill: #8fb8c4; font-size: 13px; text-anchor: middle; }
    .u { fill: #00f7ff; animation: pulse 2.4s ease-in-out infinite; }
    .g { opacity: 0; animation: up .8s ease-out forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  </style>
  <rect width="900" height="130" rx="14" fill="#0b1a20"/>

  <g class="g" style="animation-delay:.1s">
    <rect class="tile" x="15" y="15" width="200" height="85" rx="10"/>
    <text class="n" x="115" y="62">195</text><text class="l" x="115" y="84">commits</text>
    <rect class="u" x="75" y="92" width="80" height="3" rx="1.5"/>
  </g>
  <g class="g" style="animation-delay:.35s">
    <rect class="tile" x="238" y="15" width="200" height="85" rx="10"/>
    <text class="n" x="338" y="62">14</text><text class="l" x="338" y="84">DB migrations</text>
    <rect class="u" x="298" y="92" width="80" height="3" rx="1.5" style="animation-delay:.4s"/>
  </g>
  <g class="g" style="animation-delay:.6s">
    <rect class="tile" x="462" y="15" width="200" height="85" rx="10"/>
    <text class="n" x="562" y="62">15</text><text class="l" x="562" y="84">test files</text>
    <rect class="u" x="522" y="92" width="80" height="3" rx="1.5" style="animation-delay:.8s"/>
  </g>
  <g class="g" style="animation-delay:.85s">
    <rect class="tile" x="685" y="15" width="200" height="85" rx="10"/>
    <text class="n" x="785" y="62">173</text><text class="l" x="785" y="84">files touched</text>
    <rect class="u" x="745" y="92" width="80" height="3" rx="1.5" style="animation-delay:1.2s"/>
  </g>

  <text x="450" y="121" fill="#5d8794" font-size="11" text-anchor="middle">my personal commits on Kivo Eye, Jul to Oct 2026</text>
</svg>
